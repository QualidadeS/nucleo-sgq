# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production API URL
        env:
          NUCLEO_API_URL: ${{ vars.NUCLEO_API_URL }}
        run: |
          if [ -z "$NUCLEO_API_URL" ]; then
            echo "::error::Configure a variável de repositório NUCLEO_API_URL com a URL /exec do Apps Script de PRODUÇÃO."
            exit 1
          fi
          case "$NUCLEO_API_URL" in
            https://script.google.com/macros/s/*/exec) ;;
            *)
              echo "::error::NUCLEO_API_URL não é uma URL válida de Web App do Apps Script (/exec)."
              exit 1
              ;;
          esac

      - name: Generate central runtime config
        env:
          NUCLEO_API_URL: ${{ vars.NUCLEO_API_URL }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          url = os.environ["NUCLEO_API_URL"].strip()
          path = pathlib.Path("assets/nucleo-runtime-config.js")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              "window.NUCLEO_RUNTIME_CONFIG = Object.freeze(" +
              json.dumps({"apiUrl": url}, ensure_ascii=False) +
              ");\n",
              encoding="utf-8"
          )
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
