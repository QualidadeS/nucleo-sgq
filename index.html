<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Núcleo SGQ em manutenção</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #18314c; background: #f2f5f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); padding: clamp(24px, 7vw, 48px); background: white; border: 1px solid #d3dfea; border-radius: 18px; }
    .brand { margin: 0 0 24px; color: #075796; font-weight: 700; }
    h1 { margin: 0 0 12px; line-height: 1.15; font-size: clamp(1.7rem, 5vw, 2.3rem); }
    p { margin: 0 0 12px; line-height: 1.55; }
    p:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Núcleo SGQ</p>
    <h1>Estamos em manutenção</h1>
    <p>O Núcleo está temporariamente indisponível enquanto atualizamos o sistema.</p>
    <p>Tente acessar novamente mais tarde.</p>
  </main>
</body>
</html>
