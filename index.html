<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#123c60">
<title>Núcleo SGQ — Em manutenção</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:#f3f7fa;color:#17324d;font-family:Arial,Helvetica,sans-serif}main{width:100%;max-width:540px;padding:44px 36px;border:1px solid #dce5ed;border-radius:20px;background:#fff;box-shadow:0 16px 48px #123c600b;border-top:5px solid #0b559a}.brand{font-size:13px;font-weight:700;letter-spacing:.18em;color:#0b559a;margin:0 0 34px}.tag{display:inline-block;padding:7px 11px;border-radius:20px;background:#edf4fa;font-size:12px;font-weight:700;color:#175583}h1{font-size:30px;line-height:1.15;margin:20px 0 16px;letter-spacing:-.025em}p{font-size:16px;line-height:1.65;color:#526579}button{margin-top:16px;padding:12px 18px;border:0;border-radius:9px;background:#0b559a;color:white;font:600 14px Arial,Helvetica,sans-serif;cursor:pointer}button:hover{background:#08477f}button:focus-visible{outline:3px solid #63b7f2;outline-offset:4px}footer{margin-top:32px;padding-top:20px;border-top:1px solid #edf1f5;color:#6c7f90;font-size:12px}@media(max-width:480px){main{padding:32px 24px}h1{font-size:26px}}
</style>
</head>
<body>
<main>
<p class="brand">NÚCLEO SGQ</p>
<span class="tag">Manutenção programada</span>
<h1>Estamos atualizando o Núcleo.</h1>
<p>O acesso está temporariamente indisponível enquanto realizamos melhorias no sistema.</p>
<p>Por favor, tente novamente mais tarde.</p>
<button type="button" onclick="window.location.reload()">Tentar novamente</button>
<footer>SETA Embalagens · Sistema de Gestão da Qualidade</footer>
</main>
</body>
</html>
