<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f1f5f8">
  <title>Núcleo SGQ — Em manutenção</title>
  <style>
    body {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #f1f5f8;
      color: #142a40;
      font: 1rem/1.55 system-ui, sans-serif;
    }
    main {
      box-sizing: border-box;
      width: min(100%, 520px);
      padding: clamp(24px, 6vw, 48px);
      border: 1px solid #d6e0e8;
      border-radius: 16px;
      background: #fff;
    }
    .brand { margin: 0; color: #145682; font-weight: 700; }
    h1 { margin: 10px 0; font-size: clamp(1.8rem, 6vw, 2.4rem); line-height: 1.12; }
    .message { margin: 0; color: #41566b; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Núcleo SGQ</p>
    <h1>Sistema em manutenção</h1>
    <p class="message">Estamos realizando uma atualização. Tente acessar novamente mais tarde.</p>
  </main>
</body>
</html>
